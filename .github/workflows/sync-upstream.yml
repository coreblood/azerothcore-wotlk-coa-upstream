name: Sync upstream
# Automatic sync from jealous-sound is switched off (2026-09-28): main no longer pulls
# that repo on a schedule. Run it by hand from the Actions tab if a sync is ever wanted.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync coreblood/azerothcore-wotlk-coa-upstream --source jealous-sound/azerothcore-wotlk-coa --branch main